<ul class="navbar-nav ml-auto">
  <li *ngIf="!isLoggedIn">
    <a routerLink="/auth/signin" class="btn btn-primary btn-sm nav-login-btn">Se connecter</a>
  </li>
  <li *ngIf="isLoggedIn">
    <div class="dropdown drp-user" ngbDropdown placement="auto">
      <a href="javascript:" ngbDropdownToggle data-toggle="dropdown" class="nav-user-dropdown user-profile-btn">
        <!-- Avatar avec initiale -->
        <div class="user-avatar">
          <ng-container *ngIf="isAdmin()">
            <i class="feather icon-settings"></i>
          </ng-container>
          <ng-container *ngIf="!isAdmin()">
            <img *ngIf="currentUser?.avatar" [src]="currentUser.avatar" class="img-radius nav-avatar" alt="Profil">
            <span *ngIf="!currentUser?.avatar" class="avatar-initial">{{ getUserInitial() }}</span>
          </ng-container>
        </div>

        <!-- Informations utilisateur -->
        <div class="user-info d-none d-md-block">
          <span class="user-name">{{ getDisplayName() }}</span>
          <span class="user-status">
            <span class="status-dot"></span>
            Connecté
          </span>
        </div>

        <!-- Flèche dropdown -->
        <i class="feather icon-chevron-down dropdown-arrow"></i>
      </a>
      <div class="dropdown-menu dropdown-menu-right profile-notification" ngbDropdownMenu>
        <div class="pro-head">
          <ng-container *ngIf="isAdmin()">
            <i class="feather icon-settings img-radius pro-icon admin-icon"></i>
          </ng-container>
          <ng-container *ngIf="!isAdmin()">
            <img *ngIf="currentUser?.avatar" [src]="currentUser.avatar" class="img-radius" alt="Profil">
            <div *ngIf="!currentUser?.avatar" class="pro-icon avatar-initial-large">{{ getUserInitial() }}</div>
          </ng-container>
          <div class="pro-head-info">
            <span class="pro-name">{{ getDisplayName() }}</span>
            <span class="pro-email">{{ currentUser?.email }}</span>
          </div>
        </div>
        <ul class="pro-body">
          <li><a routerLink="/auth/change-password" class="dropdown-item" ngbDropdownItem><i class="feather icon-user"></i> Modifier profil</a></li>
          <li><a href="javascript:" class="dropdown-item" (click)="logout()" ngbDropdownItem><i class="feather icon-log-out"></i> Déconnexion</a></li>
        </ul>
      </div>
    </div>
  </li>
</ul>
