<div class="product-create-page">

  <!-- Header -->
  <div class="pc-header">
    <a routerLink="/products/my" class="pc-back">
      <i class="feather icon-arrow-left"></i>
    </a>
    <div>
      <h4 class="pc-title">Nouveau produit</h4>
      <p class="pc-subtitle">Ajoutez un produit à votre catalogue boutique</p>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loadingBoutique" class="pc-loading">
    <div class="pc-loader"></div>
    <p>Chargement...</p>
  </div>

  <!-- No boutique warning -->
  <div *ngIf="!loadingBoutique && !boutiqueId" class="pc-alert pc-alert-warn">
    <div class="pc-alert-icon"><i class="feather icon-alert-triangle"></i></div>
    <div class="pc-alert-body">
      <strong>Aucune boutique associée</strong>
      <p>Créez ou réservez un emplacement d'abord.</p>
      <a routerLink="/emplacement/available" class="pc-alert-link">
        <i class="feather icon-map-pin"></i> Voir les emplacements
      </a>
    </div>
  </div>

  <!-- Form -->
  <form *ngIf="!loadingBoutique && boutiqueId" [formGroup]="form" (ngSubmit)="onSubmit()" class="pc-form">

    <!-- Error -->
    <div *ngIf="errorMessage" class="pc-alert pc-alert-error">
      <i class="feather icon-alert-circle"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Boutique selector -->
    <div *ngIf="boutiques.length > 1" class="pc-boutique-selector">
      <label class="pc-boutique-label">
        <i class="feather icon-map-pin"></i> Créer dans la boutique :
      </label>
      <select class="pc-select pc-boutique-select" [(ngModel)]="boutiqueId" [ngModelOptions]="{standalone: true}" (ngModelChange)="onBoutiqueChange()">
        <option *ngFor="let b of boutiques" [value]="b.id">{{ b.name }}</option>
      </select>
    </div>

    <!-- Single compact card -->
    <div class="pc-card">
      <!-- Row 1: Nom + Catégorie -->
      <div class="pc-row">
        <div class="pc-field pc-flex-2">
          <label class="pc-label">Nom du produit <span class="req">*</span></label>
          <input type="text" class="pc-input" formControlName="name" placeholder="Nom du produit">
          <span class="pc-field-error" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">Nom requis</span>
        </div>
        <div class="pc-field">
          <label class="pc-label">Catégorie interne</label>
          <input type="text" class="pc-input" formControlName="categoryInternal" placeholder="Ex: Vêtements">
        </div>
      </div>

      <!-- Row 2: Prix + Prix barré + Stock + Seuil -->
      <div class="pc-row pc-row-4">
        <div class="pc-field">
          <label class="pc-label">Prix (Ar) <span class="req">*</span></label>
          <div class="pc-input-icon-wrap">
            <i class="feather icon-tag"></i>
            <input type="number" step="0.01" min="0" class="pc-input pc-input-icon" formControlName="price" placeholder="0.00">
          </div>
          <span class="pc-field-error" *ngIf="form.get('price')?.invalid && form.get('price')?.touched">Requis</span>
        </div>
        <div class="pc-field">
          <label class="pc-label">Prix barré (Ar)</label>
          <input type="number" step="0.01" min="0" class="pc-input" formControlName="originalPrice" placeholder="Optionnel">
        </div>
        <div class="pc-field">
          <label class="pc-label">Stock initial</label>
          <input type="number" min="0" class="pc-input" formControlName="stock" placeholder="0">
        </div>
        <div class="pc-field">
          <label class="pc-label">Seuil alerte</label>
          <input type="number" min="0" class="pc-input" formControlName="lowStockThreshold" placeholder="5">
        </div>
      </div>

      <!-- Row 3: Description + Photo URL + Disponibilité -->
      <div class="pc-row pc-row-3">
        <div class="pc-field">
          <label class="pc-label">Description</label>
          <input type="text" class="pc-input" formControlName="description" placeholder="Description courte...">
        </div>
        <div class="pc-field">
          <label class="pc-label">Photo (URL)</label>
          <div class="pc-input-icon-wrap">
            <i class="feather icon-link"></i>
            <input type="url" class="pc-input pc-input-icon" formControlName="photoUrl" placeholder="https://...">
          </div>
        </div>
        <div class="pc-field">
          <label class="pc-label">Disponibilité</label>
          <select class="pc-select" formControlName="availability">
            <option value="available">Disponible</option>
            <option value="outOfStock">Rupture de stock</option>
            <option value="onOrder">Sur commande</option>
          </select>
        </div>
      </div>

      <!-- Row 4: Image preview + Toggle -->
      <div class="pc-row-inline">
        <div *ngIf="form.get('photoUrl')?.value" class="pc-img-preview-inline">
          <img [src]="form.get('photoUrl')?.value" alt="Aperçu" (error)="onImageError()">
          <div *ngIf="imageError" class="pc-img-error">
            <i class="feather icon-alert-triangle"></i> Image invalide
          </div>
        </div>
        <label class="pc-toggle-label">
          <input type="checkbox" formControlName="isFeatured" class="pc-toggle-input">
          <span class="pc-toggle-track">
            <span class="pc-toggle-thumb"></span>
          </span>
          <span class="pc-toggle-text">Mettre en vedette</span>
        </label>
      </div>
    </div>

    <!-- Actions -->
    <div class="pc-actions">
      <a routerLink="/products/my" class="pc-btn-cancel">Annuler</a>
      <button type="submit" class="pc-btn-submit" [disabled]="loading">
        <i class="feather icon-check" *ngIf="!loading"></i>
        <span class="pc-btn-spinner" *ngIf="loading"></span>
        {{ loading ? 'Création...' : 'Créer le produit' }}
      </button>
    </div>
  </form>
</div>
