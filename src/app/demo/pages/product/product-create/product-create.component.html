<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="Nouveau produit" [options]="false">
      <div *ngIf="loadingBoutique" class="text-center py-3">Chargement...</div>
      <div *ngIf="!loadingBoutique && !boutiqueId" class="alert alert-warning">
        Aucune boutique associée à votre compte. Créez ou réservez un emplacement d'abord.
        <a routerLink="/emplacement/available" class="alert-link">Voir les emplacements</a>
      </div>

      <form *ngIf="!loadingBoutique && boutiqueId" [formGroup]="form" (ngSubmit)="onSubmit()">
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <div class="form-group">
          <label class="form-label">Nom <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="name" placeholder="Nom du produit">
          <small class="text-danger" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">Nom requis</small>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-control" formControlName="description" rows="3" placeholder="Description"></textarea>
        </div>

        <!-- Photo du produit -->
        <div class="form-group">
          <label class="form-label">Photo du produit (URL)</label>
          <input type="url" class="form-control" formControlName="photoUrl" placeholder="https://exemple.com/image.jpg">
          <small class="form-text text-muted">Entrez l'URL complète de l'image du produit</small>
          
          <!-- Aperçu de l'image -->
          <div *ngIf="form.get('photoUrl')?.value" class="mt-2">
            <img [src]="form.get('photoUrl')?.value" 
                 alt="Aperçu" 
                 class="img-thumbnail" 
                 style="max-width: 200px; max-height: 200px;"
                 (error)="onImageError()">
            <div *ngIf="imageError" class="text-danger mt-1">
              <small>⚠️ Impossible de charger l'image. Vérifiez l'URL.</small>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Prix (Ar) <span class="text-danger">*</span></label>
              <input type="number" step="0.01" min="0" class="form-control" formControlName="price" placeholder="0.00">
              <small class="text-danger" *ngIf="form.get('price')?.invalid && form.get('price')?.touched">Prix requis, min 0</small>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Prix barré (Ar)</label>
              <input type="number" step="0.01" min="0" class="form-control" formControlName="originalPrice" placeholder="Optionnel">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Catégorie interne</label>
          <input type="text" class="form-control" formControlName="categoryInternal" placeholder="Ex: Vêtements">
        </div>

        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Stock initial</label>
              <input type="number" min="0" class="form-control" formControlName="stock" placeholder="0">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label class="form-label">Seuil alerte stock</label>
              <input type="number" min="0" class="form-control" formControlName="lowStockThreshold" placeholder="5">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Disponibilité</label>
          <select class="form-control" formControlName="availability">
            <option value="available">Disponible</option>
            <option value="outOfStock">Rupture</option>
            <option value="onOrder">Sur commande</option>
          </select>
        </div>

        <div class="form-group">
          <label class="d-flex align-items-center">
            <input type="checkbox" formControlName="isFeatured" class="mr-2">
            Mettre en vedette
          </label>
        </div>

        <div class="form-group mb-0">
          <button type="submit" class="btn btn-primary" [disabled]="loading">{{ loading ? 'Création...' : 'Créer le produit' }}</button>
          <a routerLink="/products/my" class="btn btn-secondary ml-2">Annuler</a>
        </div>
      </form>
    </app-card>
  </div>
</div>
