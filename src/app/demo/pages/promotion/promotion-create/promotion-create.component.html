<div class="promo-create-page">
  <!-- Header -->
  <div class="pc-header">
    <div>
      <h4 class="pc-title"><i class="feather icon-plus-circle"></i> Nouvelle promotion</h4>
      <p class="pc-subtitle">Créez une offre pour attirer plus de clients</p>
    </div>
  </div>

  <!-- No boutique warning -->
  <div *ngIf="!boutiqueId && !loadingProducts" class="pc-warning">
    <i class="feather icon-alert-triangle"></i>
    <span>Aucune boutique trouvée. Créez d'abord des produits pour créer une promotion.</span>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="pc-error">
    <i class="feather icon-alert-triangle"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <!-- Form -->
  <div class="pc-form-card" *ngIf="boutiqueId">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Row 1: Title + Type + Value -->
      <div class="pc-row pc-row-3">
        <div class="pc-field pc-flex-2">
          <label>Titre <span class="required">*</span></label>
          <input type="text" formControlName="title" placeholder="Ex: Soldes d'été">
          <span class="field-error" *ngIf="form.get('title')?.invalid && form.get('title')?.touched">Requis</span>
        </div>
        <div class="pc-field">
          <label>Type <span class="required">*</span></label>
          <select formControlName="type">
            <option value="percentage">Pourcentage</option>
            <option value="fixed">Montant fixe</option>
            <option value="special">Spécial</option>
          </select>
        </div>
        <div class="pc-field" *ngIf="form.get('type')?.value === 'percentage'">
          <label>Réduction (%) <span class="required">*</span></label>
          <input type="number" formControlName="value" min="1" max="99" placeholder="1-99">
          <span class="field-error" *ngIf="form.get('value')?.invalid && form.get('value')?.touched">1-99</span>
        </div>
        <div class="pc-field" *ngIf="form.get('type')?.value === 'fixed'">
          <label>Réduction (Ar) <span class="required">*</span></label>
          <input type="number" formControlName="value" min="0" placeholder="Montant">
        </div>
      </div>

      <!-- Row 2: Description + Image -->
      <div class="pc-row pc-row-2">
        <div class="pc-field">
          <label>Description</label>
          <input type="text" formControlName="description" placeholder="Description optionnelle">
        </div>
        <div class="pc-field">
          <label>Image (URL)</label>
          <input type="url" formControlName="image" placeholder="https://...">
        </div>
      </div>

      <!-- Row 3: Dates -->
      <div class="pc-row pc-row-2">
        <div class="pc-field">
          <label>Date de début <span class="required">*</span></label>
          <input type="datetime-local" formControlName="startDate">
        </div>
        <div class="pc-field">
          <label>Date de fin <span class="required">*</span></label>
          <input type="datetime-local" formControlName="endDate">
          <span class="field-error" *ngIf="form.get('endDate')?.invalid && form.get('endDate')?.touched">Doit être après le début</span>
        </div>
      </div>

      <!-- Row 4: Products (compact) -->
      <div class="pc-field">
        <label>Produits concernés <span class="field-hint-inline">— ne rien cocher = toute la boutique</span></label>
        <div class="pc-product-grid">
          <label *ngFor="let prod of myProducts" class="pc-product-chip" [class.checked]="isProductSelected(prod._id)">
            <input type="checkbox" [checked]="isProductSelected(prod._id)" (change)="toggleProduct(prod._id)">
            <span class="chip-name">{{ prod.name }}</span>
            <span class="chip-price">{{ prod.price | number:'1.0-0' }} Ar</span>
          </label>
          <span *ngIf="myProducts.length === 0" class="pc-product-empty">Aucun produit.</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="pc-actions">
        <button type="button" class="pc-btn-cancel" (click)="cancel()">Annuler</button>
        <button type="submit" class="pc-btn-submit" [disabled]="form.invalid || loading">
          <i class="feather icon-check" *ngIf="!loading"></i>
          {{ loading ? 'Création...' : 'Créer la promotion' }}
        </button>
      </div>
    </form>
  </div>
</div>
