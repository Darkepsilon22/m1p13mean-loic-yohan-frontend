<div class="promo-edit-page">
  <div class="pe-header">
    <h4 class="pe-title"><i class="feather icon-edit-2"></i> Modifier la promotion</h4>
  </div>

  <div *ngIf="loadError" class="pe-alert pe-alert-danger"><i class="feather icon-alert-triangle"></i> {{ loadError }}</div>
  <div *ngIf="errorMessage" class="pe-alert pe-alert-danger"><i class="feather icon-alert-triangle"></i> {{ errorMessage }}</div>
  <div *ngIf="loading && !promotion" class="pe-loading"><div class="pe-spinner"></div><p>Chargement...</p></div>

  <div class="pe-form-card" *ngIf="!loading || promotion">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="promotion">
      <!-- Row 1: Title + Type + Value -->
      <div class="pe-row pe-row-3">
        <div class="pe-field pe-flex-2">
          <label>Titre <span class="req">*</span></label>
          <input type="text" formControlName="title" placeholder="Ex: Soldes d'été">
        </div>
        <div class="pe-field">
          <label>Type <span class="req">*</span></label>
          <select formControlName="type">
            <option value="percentage">Pourcentage</option>
            <option value="fixed">Montant fixe</option>
            <option value="special">Spécial</option>
          </select>
        </div>
        <div class="pe-field" *ngIf="form.get('type')?.value === 'percentage'">
          <label>Réduction (%) <span class="req">*</span></label>
          <input type="number" formControlName="value" min="1" max="99">
        </div>
        <div class="pe-field" *ngIf="form.get('type')?.value === 'fixed'">
          <label>Réduction (Ar) <span class="req">*</span></label>
          <input type="number" formControlName="value" min="0">
        </div>
      </div>

      <!-- Row 2: Description + Image -->
      <div class="pe-row">
        <div class="pe-field">
          <label>Description</label>
          <input type="text" formControlName="description" placeholder="Description optionnelle">
        </div>
        <div class="pe-field">
          <label>Image (URL)</label>
          <input type="url" formControlName="image" placeholder="https://...">
        </div>
      </div>

      <!-- Row 3: Dates -->
      <div class="pe-row">
        <div class="pe-field">
          <label>Date de début <span class="req">*</span></label>
          <input type="datetime-local" formControlName="startDate">
        </div>
        <div class="pe-field">
          <label>Date de fin <span class="req">*</span></label>
          <input type="datetime-local" formControlName="endDate">
        </div>
      </div>

      <!-- Products -->
      <div class="pe-field">
        <label>Produits concernés <span class="pe-hint-inline">— ne rien cocher = toute la boutique</span></label>
        <div class="pe-product-grid">
          <label *ngFor="let prod of myProducts" class="pe-chip" [class.checked]="isProductSelected(prod._id)">
            <input type="checkbox" [checked]="isProductSelected(prod._id)" (change)="toggleProduct(prod._id)">
            <span class="chip-name">{{ prod.name }}</span>
            <span class="chip-price">{{ prod.price | number:'1.0-0' }} Ar</span>
          </label>
          <span *ngIf="myProducts.length === 0" class="pe-empty">Chargement...</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="pe-actions">
        <button type="button" class="pe-btn-cancel" (click)="cancel()">Annuler</button>
        <button type="submit" class="pe-btn-submit" [disabled]="form.invalid || loading">
          {{ loading ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
