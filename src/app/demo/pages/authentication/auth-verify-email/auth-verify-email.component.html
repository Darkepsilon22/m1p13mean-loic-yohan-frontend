<div class="auth-wrapper">
  <div class="auth-content text-center">
    <div class="card borderless">
      <div class="row align-items-center">
        <div class="col-md-12">
          <div class="card-body">
            <!-- Logo -->
            <div class="mb-4">
              <i class="feather icon-shopping-bag auth-icon text-primary" style="font-size: 48px;"></i>
            </div>
            <h4 class="mb-3 f-w-400">Centre Commercial</h4>

            <!-- Loading state -->
            <div *ngIf="isLoading" class="text-center py-4">
              <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Vérification en cours...</span>
              </div>
              <p class="mt-3 text-muted">Vérification de votre email en cours...</p>
            </div>

            <!-- Success state -->
            <div *ngIf="isSuccess" class="text-center py-4">
              <div class="mb-4">
                <i class="feather icon-check-circle text-success" style="font-size: 64px;"></i>
              </div>
              <h5 class="text-success mb-3">Email vérifié avec succès!</h5>
              <p class="text-muted mb-4">{{ message }}</p>

              <div *ngIf="userRole === 'boutique'" class="alert alert-info">
                <i class="feather icon-info mr-2"></i>
                Votre compte boutique est en attente d'approbation par l'administrateur.
              </div>

              <div class="d-flex flex-column gap-2 mt-4 auth-verify-buttons">
                <button class="btn btn-primary btn-auth-sm" (click)="goToLogin()">
                  <i class="feather icon-log-in mr-2"></i>
                  Se connecter
                </button>
                <button class="btn btn-outline-secondary btn-auth-sm mt-2" (click)="goToHome()">
                  <i class="feather icon-home mr-2"></i>
                  Retour à l'accueil
                </button>
              </div>
            </div>

            <!-- Error state -->
            <div *ngIf="isError" class="text-center py-4">
              <div class="mb-4">
                <i class="feather icon-x-circle text-danger" style="font-size: 64px;"></i>
              </div>
              <h5 class="text-danger mb-3">Erreur de vérification</h5>
              <p class="text-muted mb-4">{{ message }}</p>

              <div class="d-flex flex-column gap-2 mt-4 auth-verify-buttons">
                <button class="btn btn-primary btn-auth-sm" (click)="goToLogin()">
                  <i class="feather icon-log-in mr-2"></i>
                  Aller à la connexion
                </button>
                <button class="btn btn-outline-secondary btn-auth-sm mt-2" (click)="goToHome()">
                  <i class="feather icon-home mr-2"></i>
                  Retour à l'accueil
                </button>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
