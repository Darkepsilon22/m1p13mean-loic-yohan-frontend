<div class="auth-page">
  <!-- Decorative elements -->
  <div class="auth-deco auth-deco-1"></div>
  <div class="auth-deco auth-deco-2"></div>

  <div class="auth-container">
    <div class="auth-card">
      <!-- Header -->
      <div class="auth-card-header">
        <a routerLink="/landing" class="auth-logo-link">
          <img src="assets/images/logo-dark.png" alt="Smar'ket" class="auth-logo">
        </a>
      </div>

      <!-- Body -->
      <div class="auth-card-body">
        <!-- Loading -->
        <div *ngIf="isLoading" class="auth-status">
          <div class="auth-status-icon-wrap auth-status-icon-wrap--loading">
            <span class="auth-loader"></span>
          </div>
          <h2 class="auth-status-title">Vérification en cours</h2>
          <p class="auth-status-text">Nous vérifions votre adresse email...</p>
        </div>

        <!-- Success -->
        <div *ngIf="isSuccess" class="auth-status">
          <div class="auth-status-icon-wrap auth-status-icon-wrap--success">
            <i class="feather icon-check-circle"></i>
          </div>
          <h2 class="auth-status-title auth-status-title--success">Email vérifié avec succès !</h2>
          <p class="auth-status-text">{{ message }}</p>

          <div *ngIf="userRole === 'boutique'" class="auth-info-box">
            <i class="feather icon-info"></i>
            Votre compte boutique est en attente d'approbation par l'administrateur.
          </div>

          <div class="auth-status-actions">
            <button class="auth-btn" (click)="goToLogin()">
              <i class="feather icon-log-in"></i>
              Se connecter
            </button>
            <button class="auth-btn-outline" (click)="goToHome()">
              <i class="feather icon-home"></i>
              Retour à l'accueil
            </button>
          </div>
        </div>

        <!-- Error -->
        <div *ngIf="isError" class="auth-status">
          <div class="auth-status-icon-wrap auth-status-icon-wrap--error">
            <i class="feather icon-x-circle"></i>
          </div>
          <h2 class="auth-status-title auth-status-title--error">Erreur de vérification</h2>
          <p class="auth-status-text">{{ message }}</p>

          <div class="auth-status-actions">
            <button class="auth-btn" (click)="goToLogin()">
              <i class="feather icon-log-in"></i>
              Aller à la connexion
            </button>
            <button class="auth-btn-outline" (click)="goToHome()">
              <i class="feather icon-home"></i>
              Retour à l'accueil
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
