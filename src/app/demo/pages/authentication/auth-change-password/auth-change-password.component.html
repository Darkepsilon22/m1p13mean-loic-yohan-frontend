<div class="auth-wrapper auth-change-password">
  <div class="auth-content">
    <div class="card auth-card">
      <div class="card-header auth-card-header">
        <div class="auth-card-header-inner">
          <img src="assets/images/logo-dark.png" alt="Smar'ket" class="auth-logo">
          <h4 class="auth-title">Changer le mot de passe</h4>
          <p class="auth-subtitle text-muted mb-0">Saisissez votre mot de passe actuel et le nouveau.</p>
        </div>
      </div>
      <div class="card-body">
        <div *ngIf="successMessage" class="alert alert-success" role="alert">
          {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
          {{ errorMessage }}
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label class="form-label">Mot de passe actuel</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text"><i class="feather icon-lock"></i></span>
              </div>
              <input [attr.type]="hideCurrentPassword ? 'password' : 'text'" class="form-control" formControlName="currentPassword" placeholder="Mot de passe actuel">
              <div class="input-group-append">
                <span class="input-group-text password-toggle" (click)="hideCurrentPassword = !hideCurrentPassword" (keydown.enter)="hideCurrentPassword = !hideCurrentPassword" role="button" tabindex="0" [attr.aria-label]="hideCurrentPassword ? 'Afficher' : 'Masquer'">
                  <i class="feather" [ngClass]="hideCurrentPassword ? 'icon-eye' : 'icon-eye-off'"></i>
                </span>
              </div>
            </div>
            <small class="text-danger" *ngIf="getError('currentPassword')">{{ getError('currentPassword') }}</small>
          </div>

          <div class="form-group">
            <label class="form-label">Nouveau mot de passe</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text"><i class="feather icon-lock"></i></span>
              </div>
              <input [attr.type]="hideNewPassword ? 'password' : 'text'" class="form-control" formControlName="newPassword" placeholder="Min. 8 car., maj., min., chiffre">
              <div class="input-group-append">
                <span class="input-group-text password-toggle" (click)="hideNewPassword = !hideNewPassword" (keydown.enter)="hideNewPassword = !hideNewPassword" role="button" tabindex="0" [attr.aria-label]="hideNewPassword ? 'Afficher' : 'Masquer'">
                  <i class="feather" [ngClass]="hideNewPassword ? 'icon-eye' : 'icon-eye-off'"></i>
                </span>
              </div>
            </div>
            <small class="text-danger" *ngIf="getError('newPassword')">{{ getError('newPassword') }}</small>
          </div>

          <div class="form-group">
            <label class="form-label">Confirmer le nouveau mot de passe</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text"><i class="feather icon-lock"></i></span>
              </div>
              <input [attr.type]="hideConfirmPassword ? 'password' : 'text'" class="form-control" formControlName="confirmPassword" placeholder="Confirmer">
              <div class="input-group-append">
                <span class="input-group-text password-toggle" (click)="hideConfirmPassword = !hideConfirmPassword" (keydown.enter)="hideConfirmPassword = !hideConfirmPassword" role="button" tabindex="0" [attr.aria-label]="hideConfirmPassword ? 'Afficher' : 'Masquer'">
                  <i class="feather" [ngClass]="hideConfirmPassword ? 'icon-eye' : 'icon-eye-off'"></i>
                </span>
              </div>
            </div>
            <small class="text-danger" *ngIf="getError('confirmPassword')">{{ getError('confirmPassword') }}</small>
          </div>

          <br>
          <div class="auth-submit-wrap">
            <button type="submit" class="btn btn-primary btn-auth-sm" [disabled]="loading">
              {{ loading ? 'Modification...' : 'Changer le mot de passe' }}
            </button>
          </div>
        </form>

        <div class="auth-links">
          <p class="mb-1"><a routerLink="/auth/profile" class="auth-link">Modifier mon profil</a></p>
          <p class="mb-0 mt-2"><a routerLink="/landing" class="auth-link auth-link--back">← Retour à l'accueil</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
