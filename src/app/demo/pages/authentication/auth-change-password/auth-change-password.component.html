<div class="auth-page">
  <!-- Decorative elements -->
  <div class="auth-deco auth-deco-1"></div>
  <div class="auth-deco auth-deco-2"></div>

  <div class="auth-container">
    <!-- Back link -->
    <a routerLink="/landing" class="auth-back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Retour à l'accueil
    </a>

    <div class="auth-card">
      <!-- Header -->
      <div class="auth-card-header">
        <a routerLink="/landing" class="auth-logo-link">
          <img src="assets/images/logo-dark.png" alt="Smar'ket" class="auth-logo">
        </a>
        <div class="auth-separator"></div>
        <h1 class="auth-title">Changer le mot de passe</h1>
        <p class="auth-subtitle">Saisissez votre mot de passe actuel et le nouveau.</p>
      </div>

      <!-- Body -->
      <div class="auth-card-body">
        <div *ngIf="successMessage" class="auth-alert auth-alert--success">
          <i class="feather icon-check-circle"></i>
          {{ successMessage }}
        </div>
        <div *ngIf="errorMessage" class="auth-alert auth-alert--error">
          <i class="feather icon-alert-circle"></i>
          {{ errorMessage }}
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="auth-field">
            <label class="auth-label">Mot de passe actuel</label>
            <div class="auth-input-wrap">
              <i class="feather icon-lock auth-input-icon"></i>
              <input [attr.type]="hideCurrentPassword ? 'password' : 'text'" class="auth-input auth-input--password" formControlName="currentPassword" placeholder="Mot de passe actuel">
              <button type="button" class="auth-toggle-pw" (click)="hideCurrentPassword = !hideCurrentPassword" [attr.aria-label]="hideCurrentPassword ? 'Afficher' : 'Masquer'">
                <i class="feather" [ngClass]="hideCurrentPassword ? 'icon-eye' : 'icon-eye-off'"></i>
              </button>
            </div>
            <small class="auth-error" *ngIf="getError('currentPassword')">{{ getError('currentPassword') }}</small>
          </div>

          <div class="auth-field">
            <label class="auth-label">Nouveau mot de passe</label>
            <div class="auth-input-wrap">
              <i class="feather icon-lock auth-input-icon"></i>
              <input [attr.type]="hideNewPassword ? 'password' : 'text'" class="auth-input auth-input--password" formControlName="newPassword" placeholder="Min. 8 car., maj., min., chiffre">
              <button type="button" class="auth-toggle-pw" (click)="hideNewPassword = !hideNewPassword" [attr.aria-label]="hideNewPassword ? 'Afficher' : 'Masquer'">
                <i class="feather" [ngClass]="hideNewPassword ? 'icon-eye' : 'icon-eye-off'"></i>
              </button>
            </div>
            <small class="auth-error" *ngIf="getError('newPassword')">{{ getError('newPassword') }}</small>
          </div>

          <div class="auth-field">
            <label class="auth-label">Confirmer le nouveau mot de passe</label>
            <div class="auth-input-wrap">
              <i class="feather icon-lock auth-input-icon"></i>
              <input [attr.type]="hideConfirmPassword ? 'password' : 'text'" class="auth-input auth-input--password" formControlName="confirmPassword" placeholder="Confirmer">
              <button type="button" class="auth-toggle-pw" (click)="hideConfirmPassword = !hideConfirmPassword" [attr.aria-label]="hideConfirmPassword ? 'Afficher' : 'Masquer'">
                <i class="feather" [ngClass]="hideConfirmPassword ? 'icon-eye' : 'icon-eye-off'"></i>
              </button>
            </div>
            <small class="auth-error" *ngIf="getError('confirmPassword')">{{ getError('confirmPassword') }}</small>
          </div>

          <button type="submit" class="auth-btn" [disabled]="loading">
            <span *ngIf="!loading">Changer le mot de passe</span>
            <span *ngIf="loading" class="auth-btn-loading">
              <span class="auth-spinner"></span>
              Modification...
            </span>
            <svg *ngIf="!loading" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </form>

        <!-- Links -->
        <div class="auth-footer-links">
          <p><a routerLink="/auth/profile" class="auth-link">Modifier mon profil</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
