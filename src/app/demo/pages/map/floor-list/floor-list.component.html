<div class="floor-page">
  <!-- Header -->
  <div class="floor-header">
    <div class="floor-brand">
      <i class="feather icon-layers"></i>
      <div>
        <h4 class="floor-title">Étages</h4>
        <p class="floor-subtitle">Modélisation des niveaux du centre</p>
      </div>
    </div>
    <div class="floor-header-actions">
      <a routerLink="/map/view" class="floor-btn floor-btn-outline">
        <i class="feather icon-layout"></i> Voir le plan
      </a>
      <button class="floor-btn floor-btn-primary" (click)="toggleCreateForm()">
        <i class="feather" [ngClass]="showCreateForm ? 'icon-x' : 'icon-plus'"></i>
        {{ showCreateForm ? 'Annuler' : 'Créer un étage' }}
      </button>
    </div>
  </div>

  <!-- Create Form -->
  <div *ngIf="showCreateForm" class="floor-create-card">
    <h6 class="create-title"><i class="feather icon-plus-circle"></i> Nouvel étage</h6>
    <form [formGroup]="createForm" (ngSubmit)="onSubmitCreate()" class="create-form">
      <div class="form-field">
        <label>Nom</label>
        <input type="text" formControlName="name" placeholder="ex. RDC" />
      </div>
      <div class="form-field">
        <label>Largeur</label>
        <input type="number" formControlName="width" min="10" />
      </div>
      <div class="form-field">
        <label>Hauteur</label>
        <input type="number" formControlName="height" min="10" />
      </div>
      <button type="submit" class="floor-btn floor-btn-success" [disabled]="createForm.invalid || creating">
        {{ creating ? 'Création...' : 'Créer' }}
      </button>
    </form>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="floor-alert floor-alert-danger">
    <i class="feather icon-alert-triangle"></i> {{ errorMessage }}
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="floor-loading">
    <div class="floor-spinner"></div>
    <p>Chargement...</p>
  </div>

  <!-- Empty -->
  <div *ngIf="!loading && floors.length === 0 && !errorMessage" class="floor-empty">
    <div class="floor-empty-icon"><i class="feather icon-layers"></i></div>
    <h5>Aucun étage</h5>
    <p>Créez votre premier étage pour commencer à modéliser le plan.</p>
  </div>

  <!-- Table -->
  <div class="floor-table-card" *ngIf="!loading && floors.length > 0">
    <table class="floor-table">
      <thead>
        <tr>
          <th>Ordre</th>
          <th>Nom</th>
          <th>Dimensions</th>
          <th class="text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let f of floors">
          <tr *ngIf="editingFloorId !== f._id">
            <td class="td-mono">{{ f.order ?? 0 }}</td>
            <td class="td-name">{{ f.name }}</td>
            <td class="td-dim">{{ f.width }} × {{ f.height }}</td>
            <td class="td-actions">
              <button class="action-btn action-primary" (click)="goToEditor(f._id)" title="Éditer le plan">
                <i class="feather icon-edit-2"></i>
              </button>
              <button class="action-btn action-default" (click)="startEdit(f)" title="Modifier">
                <i class="feather icon-settings"></i>
              </button>
              <button class="action-btn action-danger" (click)="deleteFloor(f)" [disabled]="deleteId === f._id" title="Supprimer">
                <i class="feather icon-trash-2"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="editingFloorId === f._id" class="editing-row">
            <td colspan="4">
              <form [formGroup]="editForm" (ngSubmit)="onSubmitEdit()" class="edit-inline-form">
                <div class="form-field compact">
                  <label>Nom</label>
                  <input type="text" formControlName="name" />
                </div>
                <div class="form-field compact">
                  <label>Largeur</label>
                  <input type="number" formControlName="width" min="10" />
                </div>
                <div class="form-field compact">
                  <label>Hauteur</label>
                  <input type="number" formControlName="height" min="10" />
                </div>
                <div class="form-field compact">
                  <label>Ordre</label>
                  <input type="number" formControlName="order" min="0" />
                </div>
                <div class="edit-actions">
                  <button type="submit" class="floor-btn floor-btn-success floor-btn-sm" [disabled]="editForm.invalid || updating">Enregistrer</button>
                  <button type="button" class="floor-btn floor-btn-outline floor-btn-sm" (click)="cancelEdit()">Annuler</button>
                </div>
              </form>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</div>
