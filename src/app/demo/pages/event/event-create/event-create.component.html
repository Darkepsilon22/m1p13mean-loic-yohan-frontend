<div class="admin-form-page">
  <div class="af-header">
    <div>
      <a routerLink="/events/list" class="af-back-link"><i class="feather icon-arrow-left"></i> Retour aux événements</a>
      <h4 class="af-title"><i class="feather icon-calendar"></i> Nouvel événement</h4>
      <p class="af-subtitle">Créez un événement pour le centre commercial</p>
    </div>
  </div>

  <div class="af-card">
    <div class="af-card-body">
      <div *ngIf="errorMessage" class="af-error">
        <i class="feather icon-alert-triangle"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- Row 1: Titre + Image URL -->
        <div class="af-form-row af-row-2">
          <div class="af-field">
            <label class="af-label">Titre <span class="af-required">*</span></label>
            <input type="text" class="af-input" formControlName="title" placeholder="Ex: Journée portes ouvertes">
          </div>
          <div class="af-field">
            <label class="af-label">Image (URL) <span class="af-required">*</span></label>
            <input type="url" class="af-input" formControlName="image" placeholder="https://...">
          </div>
        </div>

        <!-- Row 2: Description courte (full) -->
        <div class="af-form-row">
          <div class="af-field af-field-full">
            <label class="af-label">Description courte</label>
            <input type="text" class="af-input" formControlName="shortDescription" placeholder="Résumé optionnel">
          </div>
        </div>

        <!-- Row 3: Description (full) -->
        <div class="af-form-row">
          <div class="af-field af-field-full">
            <label class="af-label">Description <span class="af-required">*</span></label>
            <textarea class="af-textarea" formControlName="description" rows="3" placeholder="Description de l'événement"></textarea>
          </div>
        </div>

        <!-- Row 4: Date début + Date fin + Visibilité + Vedette -->
        <div class="af-form-row af-row-4">
          <div class="af-field">
            <label class="af-label">Date de début <span class="af-required">*</span></label>
            <input type="datetime-local" class="af-input" formControlName="startDate">
          </div>
          <div class="af-field">
            <label class="af-label">Date de fin <span class="af-required">*</span></label>
            <input type="datetime-local" class="af-input" formControlName="endDate">
          </div>
          <div class="af-field">
            <label class="af-label">Visibilité</label>
            <select class="af-select" formControlName="visibility">
              <option value="public">Public</option>
              <option value="boutiques">Boutiques uniquement</option>
            </select>
          </div>
          <div class="af-field af-field-check">
            <label class="af-label">&nbsp;</label>
            <label class="af-checkbox-label">
              <input type="checkbox" class="af-checkbox" formControlName="isFeatured">
              <span>En vedette</span>
            </label>
          </div>
        </div>

        <div class="af-actions">
          <button type="submit" class="af-btn af-btn-primary" [disabled]="form.invalid || loading">
            <i class="feather icon-check"></i>
            {{ loading ? 'Création...' : 'Créer l\'événement' }}
          </button>
          <button type="button" class="af-btn af-btn-outline" (click)="cancel()">Annuler</button>
        </div>
      </form>
    </div>
  </div>
</div>
