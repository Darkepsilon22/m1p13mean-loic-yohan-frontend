<!doctype html>
<html lang="fr">
<head>

  <title>Smar'ket — Centre Commercial en Ligne</title>
  <base href="/">

  <!-- Security -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Meta -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0, minimal-ui">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Smar'ket est un centre commercial en ligne regroupant des boutiques, produits, promotions et événements. Découvrez, achetez et gérez vos commandes facilement.">
  <meta name="keywords" content="centre commercial, boutique en ligne, achat, produits, promotions, événements, e-commerce, Smar'ket, Madagascar">
  <meta name="author" content="Smar'ket">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="http://localhost:4200/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Smar'ket — Centre Commercial en Ligne">
  <meta property="og:description" content="Découvrez des boutiques, produits et promotions sur Smar'ket, votre centre commercial en ligne.">
  <meta property="og:image" content="assets/images/logo-dark.png">
  <meta property="og:url" content="http://localhost:4200/">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Smar'ket">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Smar'ket — Centre Commercial en Ligne">
  <meta name="twitter:description" content="Découvrez des boutiques, produits et promotions sur Smar'ket, votre centre commercial en ligne.">
  <meta name="twitter:image" content="assets/images/logo-dark.png">

  <!-- Favicon icon (Smar'ket) -->
  <link rel="icon" type="image/png" href="assets/images/logo-icon.png">
  <link rel="shortcut icon" type="image/png" href="assets/images/logo-icon.png">

  <!-- Structured Data - Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Smar'ket",
    "description": "Centre commercial en ligne regroupant des boutiques, produits, promotions et événements.",
    "url": "http://localhost:4200",
    "logo": "assets/images/logo-dark.png"
  }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
